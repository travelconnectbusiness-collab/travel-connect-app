name: Guard check

# Free: runs on every push, takes a few seconds. A red X means a file is broken
# or a must-keep feature disappeared. See scripts/guard.js.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/guard.js
