name: Build Android App (Debug APK)

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (required by Android's Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copy web app files into the Capacitor project
        run: |
          mkdir -p android-app/www
          cp -r src android-app/www/
          cp index.html android-app/www/
          cp manifest.webmanifest android-app/www/
          cp icon-192.png android-app/www/ 2>/dev/null || true
          cp icon-512.png android-app/www/ 2>/dev/null || true

      - name: Fix API calls for the native app (Capacitor-only, does not affect the website)
        run: |
          cat > android-app/www/capacitor-api-fix.js << 'JSEOF'
          (function(){
            if (!window.Capacitor) return;
            var API_BASE = "https://travel-connect-app.travelconnect-business.workers.dev";
            var origFetch = window.fetch;
            window.fetch = function(input, init){
              if (typeof input === "string" && input.indexOf("/api/") === 0) {
                input = API_BASE + input;
              }
              return origFetch(input, init);
            };
          })();
          JSEOF
          sed -i 's#<script src="/src/TravelConnect-logo-data.js#<script src="capacitor-api-fix.js"></script>\n<script src="/src/TravelConnect-logo-data.js#' android-app/www/index.html

      - name: Install Capacitor
        working-directory: android-app
        run: npm install

      - name: Add the Android platform (first run only - harmless if it already exists)
        working-directory: android-app
        run: npx cap add android || true

      - name: Sync web assets into the Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-connect-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
