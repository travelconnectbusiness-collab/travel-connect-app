<style>
/* Disables the browser's native "pull down to refresh" gesture - this is
   the trigger for the stale-content issue (a network-level caching layer
   outside this app's control intercepts that specific reload, even though
   in-app navigation always correctly loads the latest version). Removing
   the gesture removes the trigger entirely; in-app navigation (tapping any
   button) remains completely unaffected and still always shows the latest
   version, and is now the only way to "refresh" the page - which is fine,
   since that path was already proven reliable. */
html,body{overscroll-behavior-y:contain}
</style>

<script>
/* Re-registers the Service Worker (previously unregistered while
   diagnosing the stale-content issue) - now WITH an explicit auto-reload
   the moment a NEW service worker takes control of the page
   (controllerchange). sw.js's own skipWaiting()+clients.claim() make a
   newly-installed SW take over immediately rather than waiting for every
   tab to close first; this listener is what makes the ALREADY-OPEN page
   actually pick up that change instead of silently continuing to run
   under whatever was loaded at open time. */
if('serviceWorker' in navigator){
 addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
 navigator.serviceWorker.addEventListener('controllerchange',()=>{ location.reload(); });
}
</script>
<script>
/* If this page is ever restored from the browser's "back-forward cache"
   (bfcache) instead of being freshly loaded from the network - which can
   happen on some mobile browsers' pull-to-refresh gesture - force a real
   reload. event.persisted is true only when the page came from bfcache,
   never on a genuine fresh load, so this never causes an extra reload on
   normal navigation. */
window.addEventListener('pageshow',function(e){ if(e.persisted) location.reload(); });
</script>
