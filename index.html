<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Connect</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#082b49">
<link rel="stylesheet" href="/app.css?v=20260925b">
<style>
/* Supplementary rules only - app.css above is the real stylesheet and is
   left untouched. These just (1) add safe-area padding for phones with a
   notch/status-bar overlay, since app.css predates that concern, and
   (2) exempt checkbox/radio inputs from app.css's own
   "input,select,textarea{padding:11px;...}" rule - harmless for a normal
   checkbox, but it breaks a custom sliding-switch control (used for the
   partner/vehicle "Active" toggle) built from a zero-sized checkbox with
   styled spans layered on top: the extra padding/border expands that
   checkbox's box far beyond its intended invisible sliver, so clicks meant
   for the switch land somewhere app.css's padding put the real hit target
   instead. Restated with !important since it must win over that rule
   regardless of selector order. */
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); overscroll-behavior-y:contain; }
body{ overscroll-behavior-y:contain; }
.top{ padding-top:calc(14px + env(safe-area-inset-top,0px)) !important; }
.tabs{ padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)) !important; }
input[type="checkbox"],input[type="radio"]{
 width:auto !important; height:auto !important; padding:0 !important; border:none !important; background:none !important;
}
</style>
</head>
<body>
<div class="top" id="topHeader"></div>
<div class="tabs" id="tabsRow">
 <button data-view="dashboard">Dashboard</button>
 <button data-view="enquiries">Enquiries</button>
 <button data-view="quotations">Quotations</button>
 <button data-view="trips">Trips</button>
 <button data-view="billing">Billing</button>
 <button data-view="master">Rate Master</button>
 <button data-view="accounts">Accounts</button>
</div>
<div id="app"></div>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBody"></div></div>

<script>
window.addEventListener('pageshow',function(e){ if(e.persisted) location.reload(); });

<script>

 addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
 navigator.serviceWorker.addEventListener('controllerchange',()=>{ location.reload(); });
}
</script>
