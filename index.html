<style>
/* Supplementary rules only - app.css above is the real stylesheet and is
   left untouched. These just (1) add safe-area padding for phones with a
   notch/status-bar overlay, since app.css predates that concern, and
   (2) exempt checkbox/radio inputs from app.css's own
   "input,select,textarea{padding:11px;...}" rule - harmless for a normal
   checkbox, but it breaks a custom sliding-switch control (used for the
   partner/vehicle "Active" toggle) built from a zero-sized checkbox with
   styled spans layered on top: the extra padding/border expands that
   checkbox's box far beyond its intended invisible sliver, so clicks meant
   for the switch land somewhere app.css's padding put the real hit target
   instead. Restated with !important since it must win over that rule
   regardless of selector order. */
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); overscroll-behavior-y:contain; }
body{ overscroll-behavior-y:contain; }
.top{ padding-top:calc(14px + env(safe-area-inset-top,0px)) !important; }
.tabs{ padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)) !important; }
input[type="checkbox"],input[type="radio"]{
 width:auto !important; height:auto !important; padding:0 !important; border:none !important; background:none !important;
}

/* ---- Premium look for every button ----
   Softer corners, a light shadow, a gentle press effect; primary buttons
   get a teal gradient and delete/danger buttons a solid red one (app.css
   only coloured the text of "danger"). Inline styles on individual
   buttons (SOS, Messages, Emergency) still win over these. */
button{
 border-radius:12px;
 box-shadow:0 1px 3px rgba(8,43,73,.16);
 transition:transform .08s ease,box-shadow .15s ease,filter .15s ease;
 -webkit-tap-highlight-color:transparent;
}
button:active{ transform:scale(.96); filter:brightness(.95); }
button.primary{
 background:linear-gradient(135deg,#0b6b78 0%,#12898f 100%);
 box-shadow:0 3px 9px rgba(11,107,120,.38);
}
button.danger{
 background:linear-gradient(135deg,#b03a2e,#e74c3c);
 color:#fff;
 box-shadow:0 3px 9px rgba(176,58,46,.38);
}
.tabs button,.backbtn,.close{ box-shadow:none; }
.tabs button:active{ transform:none; }

/* Pulsing glow on the SOS buttons, and a heartbeat on the unread-count pill */
@keyframes tcSosPulse{
 0%{ box-shadow:0 0 0 0 rgba(231,76,60,.65); }
 70%{ box-shadow:0 0 0 12px rgba(231,76,60,0); }
 100%{ box-shadow:0 0 0 0 rgba(231,76,60,0); }
}
@keyframes tcPill{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.18); } }
.tcMsgPill{ animation:tcPill 1.6s ease-in-out infinite; }
</style>
</head>

<script>
if('serviceWorker' in navigator){
 let tcSwReg=null, tcSwReloading=false;
 /* An SPA like this one almost never does a real browser page navigation
    (every screen change is just view() swapping innerHTML) - and a
    browser only checks the SERVER for a newer sw.js on an actual
    navigation/reload. So without this, a new deployment could sit on the
    server indefinitely while an already-open tab keeps running the old
    code, which is exactly why closing and reopening the app was the only
    way updates ever showed up. This explicitly asks the browser to check
    for a newer sw.js: right away, then every time the app is reopened
    from the background (the moment someone is most likely to actually
    look at the screen), and every 10 minutes while it stays open and
    visible. */
 function tcCheckForUpdate(){ if(tcSwReg) tcSwReg.update().catch(()=>{}); }
 addEventListener('load',()=>{
  navigator.serviceWorker.register('/sw.js').then(reg=>{
   tcSwReg=reg;
   reg.addEventListener('updatefound',()=>{
    const installing=reg.installing;
    if(!installing) return;
    installing.addEventListener('statechange',()=>{
     /* "installed" with an existing controller means a new version is
        ready and waiting - not that this is the very first install. */
     if(installing.state==='installed'&&navigator.serviceWorker.controller){
      if(typeof tcShowUpdateBanner==='function') tcShowUpdateBanner();
     }
    });
   });
  }).catch(()=>{});
 });
 /* Going to the background is exactly the safe moment to apply an update
    on its own, with no tap needed: nobody is looking at the screen or
    mid-way through typing into it right then, so activating the new
    worker (and the reload that follows once it takes over) happens
    unseen - by the time the person reopens the app, the new version is
    already there waiting for them. Coming back to the FOREGROUND instead
    checks the server for anything newer, in case a deployment happened
    while this device had the app in the background. */
 document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'){ tcCheckForUpdate(); return; }
  if(!tcSwReg) return;
  if(tcSwReg.waiting){ tcSwReg.waiting.postMessage({type:'SKIP_WAITING'}); return; }
  try{ await tcSwReg.update(); if(tcSwReg.waiting) tcSwReg.waiting.postMessage({type:'SKIP_WAITING'}); }catch(e){}
 });
 setInterval(tcCheckForUpdate,600000);
 /* Never reloads on its own - a silent reload could wipe out a form
    someone is halfway through filling in. This only ever fires after the
    person themselves taps "Reload Now" on the banner (tcApplyUpdate,
    core.js) or the Menu's "Reload App" button, both of which call
    skipWaiting() on the waiting worker first; THAT is what causes this
    controllerchange event, so by the time it fires the new code is
    already active and reloading is safe and expected. */
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(tcSwReloading) return;
  tcSwReloading=true;
  location.reload();
 });
}
</script>
